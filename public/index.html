<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Propostas para Editais</title>
    <style>
      :root {
        color-scheme: dark only;
        --bg: #0A1128;
        --surface: rgba(26, 42, 74, 0.8);
        --line: #2A3A5A;
        --brand: #3B82F6;
        --brand-glow: rgba(59, 130, 246, 0.3);
        --accent: #FFB703;
        --text: #ffffff;
        --text-soft: #94a3b8;
        --error: #ff6f86;
        --ok: #35c886;
        --radius-lg: 24px;
        --radius-md: 12px;
        font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        line-height: 1.5;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: #1A2A4A;
        z-index: 100;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .container {
        width: 100%;
        max-width: 900px;
        animation: fadeIn 0.8s ease-out;
      }

      .header {
        margin-bottom: 2.5rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.4rem 1rem;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid var(--brand);
        color: var(--brand);
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(to right, #fff, var(--text-soft));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header p {
        color: var(--text-soft);
        font-size: 1.1rem;
        margin-top: 0.5rem;
      }

      .panel {
        background: var(--surface);
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 2.5rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .panel:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 60px var(--brand-glow);
      }

      .panel-head {
        margin-bottom: 2rem;
      }

      .panel-title {
        color: var(--brand);
        font-size: 1.5rem;
        margin: 0;
      }

      .panel-subtitle {
        color: var(--text-soft);
        font-size: 0.9rem;
        margin-top: 0.25rem;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      .grid-2 {
        display: grid;
        gap: 1rem;
      }

      @media (min-width: 720px) {
        .grid-2 {
          grid-template-columns: 1fr 1fr;
        }
      }

      .field {
        display: grid;
        gap: 0.42rem;
        background: rgba(9, 14, 26, 0.42);
        border: 1px solid #1a2540;
        border-radius: 10px;
        padding: 0.8rem;
      }

      label {
        font-size: 0.86rem;
        font-weight: 550;
        color: #d7e0f9;
        letter-spacing: 0.01em;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #2c3960;
        border-radius: 10px;
        background: #080e1b;
        color: var(--text);
        padding: 0.7rem 0.8rem;
        box-sizing: border-box;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: #61708f;
      }

      input:focus-visible,
      textarea:focus-visible {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 4px rgba(76, 125, 255, 0.16);
      }

      .is-invalid input,
      .is-invalid textarea {
        border-color: #d05a6d;
      }

      .is-valid input,
      .is-valid textarea {
        border-color: #2f9469;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .hint {
        color: #8e9fbd;
        font-size: 0.78rem;
      }

      .error {
        color: var(--error);
        font-size: 0.78rem;
        min-height: 0.95rem;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.15rem;
      }

      .action-left {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .primary-btn {
        border: 1px solid transparent;
        background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
        color: #fff;
        border-radius: 10px;
        padding: 0.74rem 1.18rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.18s ease;
      }

      .primary-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.07);
      }

      .primary-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      #feedback {
        margin-top: 0.45rem;
        min-height: 1rem;
        color: var(--error);
        font-size: 0.82rem;
      }

      #feedback.is-info {
        color: var(--text-soft);
      }

      #feedback.is-ok {
        color: var(--ok);
      }

      .pdf-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.5rem;
      }

      .pdf-row input[type="file"] {
        flex: 1 1 200px;
        min-width: 0;
        padding: 0.45rem 0.5rem;
        font-size: 0.82rem;
      }

      .secondary-btn {
        border: 1px solid #3a5080;
        background: #121c32;
        color: #d0dcfa;
        border-radius: 10px;
        padding: 0.6rem 0.95rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .secondary-btn:hover:not(:disabled) {
        background: #182442;
      }

      .secondary-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

    </style>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <span class="badge">Editais</span>
        <h1>Dados do Projeto</h1>
        <p>Preencha as informações essenciais para gerar um rascunho alinhado ao edital.</p>
      </header>

      <section class="layout">
        <div class="panel form-panel">
          <div class="panel-head">
              <h2 class="panel-title">Formulário de proposta</h2>
              <p class="panel-subtitle">Campos obrigatórios para geração automática do rascunho.</p>
          </div>

          <form id="pipeline-form" novalidate>
            <div class="field" data-field="titulo">
              <label for="titulo">Título</label>
              <input id="titulo" name="titulo" type="text" placeholder="Ex.: Plataforma de apoio à escrita de editais" />
              <span class="error" data-error-for="titulo"></span>
            </div>

            <div class="grid-2">
              <div class="field" data-field="orcamento">
                <label for="orcamento">Orçamento</label>
                <input id="orcamento" name="orcamento" type="text" placeholder="Ex.: R$ 50.000,00" />
                <span class="error" data-error-for="orcamento"></span>
              </div>

              <div class="field" data-field="equipe">
                <label for="equipe">Equipe</label>
                <input id="equipe" name="equipe" type="text" placeholder="Ex.: 2 pesquisadores + 1 dev" />
                <span class="error" data-error-for="equipe"></span>
              </div>
            </div>

            <div class="field" data-field="descricao">
              <label for="descricao">Descrição</label>
              <textarea id="descricao" name="descricao" placeholder="Resumo do projeto e problema a resolver."></textarea>
              <span class="error" data-error-for="descricao"></span>
            </div>

            <div class="field" data-field="objetivos">
              <label for="objetivos">Objetivos</label>
              <textarea id="objetivos" name="objetivos" placeholder="Objetivo geral e objetivos específicos."></textarea>
              <span class="error" data-error-for="objetivos"></span>
            </div>

            <div class="field" data-field="metodologia">
              <label for="metodologia">Metodologia</label>
              <textarea id="metodologia" name="metodologia" placeholder="Como o projeto será executado (etapas, métodos, ferramentas)."></textarea>
              <span class="error" data-error-for="metodologia"></span>
            </div>

            <div class="field" data-field="editalText">
              <label for="editalText">Texto do edital</label>
              <div class="pdf-row">
                <input
                  id="pdf-file"
                  type="file"
                  accept=".pdf,application/pdf"
                  aria-label="Arquivo PDF do edital"
                />
                <button class="secondary-btn" id="pdf-extract-btn" type="button">
                  Extrair texto do PDF
                </button>
              </div>
              <span class="hint"
                >Envie um PDF para preencher o campo automaticamente ou cole o texto do edital manualmente.</span
              >
              <textarea id="editalText" name="editalText" placeholder="Cole aqui o texto extraído do edital."></textarea>
              <span class="error" data-error-for="editalText"></span>
            </div>

            <div class="actions">
              <div class="action-left">
                <button class="primary-btn" id="submit-btn" type="submit">Gerar proposta</button>
              </div>
            </div>
            <div id="feedback" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
